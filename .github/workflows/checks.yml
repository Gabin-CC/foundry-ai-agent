name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-checks:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Validate JavaScript and shell scripts
        run: |
          node --check listen.mjs
          node --check scripts/smoke-test.mjs
          bash -n run.sh
          bash -n scripts/smoke-test.sh
          if [ -f install.sh ]; then bash -n install.sh; fi
      - name: Verify installed Foundry client import
        run: node --input-type=module -e 'import { loadFoundrySession } from "./lib/foundry-module.mjs"; await loadFoundrySession();'
      - name: Run unit tests (no live Foundry needed)
        run: npm test
      - name: Validate release metadata and tracked paths
        run: npm run check:release
